<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نور القرآن | القرآن الكريم كاملًا</title>
  <meta name="description" content="موقع القرآن الكريم كاملًا: مصحف، قراءة، استماع بأصوات كبار القراء، تفسير ميسر، بحث في الآيات، علامات مرجعية ومواقيت الصلاة.">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link rel="manifest" href="/manifest.webmanifest">
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;600;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0a0a'/%3E%3Ccircle cx='50' cy='50' r='26' fill='none' stroke='%23d4af37' stroke-width='8'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a0a0a;--bg2:#111111;--card:#151515;--line:#2a2412;
  --gold:#d4af37;--gold-2:#f1d06b;--gold-3:#a8801c;
  --text:#f3ead2;--muted:#9b9378;--fs:34px;--radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--text);
  line-height:1.7;min-height:100vh;padding-bottom:90px;
}

button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.muted{color:var(--muted);font-size:.9rem}

.top{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:12px clamp(14px,4vw,40px);background:rgba(10,10,10,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand-name{
  font-family:'Reem Kufi',serif;font-size:1.6rem;font-weight:700;
  background:linear-gradient(135deg,var(--gold-2),var(--gold),var(--gold-3));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.search{flex:1;max-width:520px;margin-inline:auto}
.search input{
  width:100%;padding:10px 18px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg2);outline:none;transition:.2s;font-size:.95rem;
}
.search input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.15)}
.search input::placeholder{color:var(--muted)}
.icon-btn{
  width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--bg2);
  color:var(--gold);font-size:1.1rem;transition:.2s;display:inline-grid;place-items:center;flex:none;
}
.icon-btn:hover{border-color:var(--gold);background:#1b1708}
.icon-btn.big{width:52px;height:52px;background:linear-gradient(135deg,var(--gold-2),var(--gold-3));color:#0a0a0a;border:none;font-size:1.2rem}

main{max-width:1100px;margin:0 auto;padding:28px clamp(14px,4vw,32px)}

.btn{padding:10px 22px;border-radius:999px;font-weight:600;font-size:.95rem;border:1px solid var(--gold);transition:.2s}
.btn.gold{background:linear-gradient(135deg,var(--gold-2),var(--gold),var(--gold-3));color:#0a0a0a;border:none}
.btn.gold:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--gold)}
.btn.ghost:hover{background:rgba(212,175,55,.1)}
.link-btn{background:none;border:none;color:var(--gold);font-size:.85rem;text-decoration:underline}

.hero{display:grid;grid-template-columns:1fr 300px;gap:22px;margin-bottom:34px}
.hero-main,.prayer{
  background:linear-gradient(160deg,#17140a,#0e0e0e);border:1px solid var(--line);
  border-radius:22px;padding:28px;position:relative;overflow:hidden;
}
.eyebrow{color:var(--gold);font-weight:700;margin-bottom:10px;position:relative}
.daily{position:relative;min-height:120px}
.daily .verse{font-family:'Amiri Quran',serif;font-size:clamp(1.6rem,3.4vw,2.3rem);line-height:2.1;color:var(--gold-2)}
.daily .ref{margin-top:8px;color:var(--muted);font-size:.9rem}
.daily .tf{margin-top:10px;color:var(--text);opacity:.85;font-size:.95rem}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;position:relative}
.prayer h3{font-family:'Reem Kufi',serif;color:var(--gold);font-size:1.25rem}
.prayer-head{display:flex;justify-content:space-between;align-items:center}
.prayer ul{list-style:none;margin-top:12px}
.prayer li{display:flex;justify-content:space-between;padding:8px 10px;border-radius:10px;font-size:.95rem}
.prayer li.next{background:rgba(212,175,55,.14);color:var(--gold-2);font-weight:700}

.tabs{display:flex;gap:8px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.tab{background:none;border:none;padding:10px 20px;color:var(--muted);font-weight:600;font-size:1rem;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.2s}
.tab.active{color:var(--gold);border-color:var(--gold)}
.tab:hover{color:var(--gold-2)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{
  display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px 16px;text-align:right;transition:.2s;width:100%;
}
.card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 8px 24px rgba(212,175,55,.08)}
.num{width:42px;height:42px;flex:none;display:grid;place-items:center;color:var(--gold);font-weight:700;position:relative;font-size:.95rem}
.num::before{content:"";position:absolute;inset:4px;border:1.5px solid var(--gold);transform:rotate(45deg);border-radius:4px}
.num::after{content:"";position:absolute;inset:4px;border:1.5px solid var(--gold-3);border-radius:4px;opacity:.6}
.num span{position:relative;z-index:1}
.card-body{flex:1;min-width:0}
.card-name{font-family:'Amiri Quran',serif;font-size:1.45rem;color:var(--gold-2);line-height:1.5}
.card-meta{font-size:.8rem;color:var(--muted)}
.card-end{font-family:'Reem Kufi',serif;color:var(--gold-3);font-size:.9rem}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}

.section-title{font-family:'Reem Kufi',serif;color:var(--gold);margin:16px 0}
.results{display:grid;gap:12px}
.result{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;cursor:pointer;transition:.2s;text-align:right;width:100%}
.result:hover{border-color:var(--gold)}
.result .rt{font-family:'Amiri Quran',serif;font-size:1.5rem;line-height:2;color:var(--text)}
.result .rr{color:var(--gold);font-size:.85rem;margin-top:4px}
mark{background:rgba(212,175,55,.3);color:var(--gold-2);border-radius:4px;padding:0 2px}

.reader-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ctl{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted)}
select{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;outline:none;color:var(--text)}
select:focus{border-color:var(--gold)}
input[type=range]{accent-color:var(--gold);cursor:pointer}
.switch input{accent-color:var(--gold);width:18px;height:18px}
.switch span{color:var(--text)}

.surah-head{text-align:center;padding:30px 16px 24px;margin-bottom:22px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(160deg,#17140a,#0e0e0e)}
.surah-head h1{
  font-family:'Amiri Quran',serif;font-size:clamp(2.2rem,6vw,3.6rem);font-weight:400;
  background:linear-gradient(135deg,var(--gold-2),var(--gold),var(--gold-3));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.bismillah{font-family:'Amiri Quran',serif;font-size:clamp(1.5rem,3.5vw,2.1rem);color:var(--gold-2);margin:10px 0 18px}

.ayah{padding:20px 8px 14px;border-bottom:1px solid #1c1a10;transition:background .3s;border-radius:12px}
.ayah.active{background:rgba(212,175,55,.09);box-shadow:inset 3px 0 0 var(--gold)}
.ayah.last{box-shadow:inset 3px 0 0 var(--gold-3)}
.atext{font-family:'Amiri Quran',serif;font-size:var(--fs);line-height:2.3;color:var(--text);cursor:pointer;text-align:justify}
.amark{color:var(--gold);font-size:.75em;margin-inline-start:6px;white-space:nowrap}
.tafsir{margin-top:8px;padding:12px 16px;border-radius:12px;background:var(--bg2);border:1px dashed var(--line);color:#cfc6aa;font-size:1rem;line-height:1.9}
.acts{display:flex;gap:8px;margin-top:10px;opacity:.75}
.ayah:hover .acts,.ayah.active .acts{opacity:1}
.act{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:.82rem;color:var(--gold);transition:.2s}
.act:hover{border-color:var(--gold)}
.act.on{background:var(--gold);color:#0a0a0a;border-color:var(--gold)}
.surah-nav{display:flex;justify-content:space-between;gap:12px;margin:36px 0 10px}

.tabs{overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none}
.az-top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px}
.dhikr.done{opacity:.55}
.dhikr .h-text::before,.dhikr .h-text::after{content:none}
.ayah-banner{text-align:center;font-family:'Amiri Quran',serif;font-size:clamp(1.2rem,3vw,1.6rem);color:var(--gold);padding:14px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#12100a,var(--bg))}
.hadith-list{grid-template-columns:1fr}
.hadith{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 22px}
.h-intro{color:var(--gold);font-size:.9rem;margin-bottom:6px}
.h-text{font-family:'Amiri Quran',serif;font-size:calc(var(--fs)*.75);line-height:2.2;color:var(--text)}
.h-text::before{content:"«";color:var(--gold);margin-inline-end:4px}
.h-text::after{content:"»";color:var(--gold);margin-inline-start:4px}
.h-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.h-no{color:var(--gold-3);font-family:'Reem Kufi',serif}

/* المصحف */
.m-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.m-ctrls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.m-input{width:78px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;outline:none;text-align:center}
.m-input:focus{border-color:var(--gold)}
.m-page{
  max-width:780px;margin:0 auto;padding:24px clamp(14px,4vw,44px) 18px;
  background:linear-gradient(180deg,#15120a,#0d0b06);
  border:2px solid var(--gold-3);border-radius:10px;min-height:60vh;
  box-shadow:0 0 0 6px #0a0a0a,0 0 0 7px var(--gold-3),0 24px 60px rgba(0,0,0,.65);
}
.m-top{display:flex;justify-content:space-between;color:var(--gold);font-family:'Reem Kufi',serif;font-size:1.05rem;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.m-foot{display:flex;justify-content:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.m-foot span{
  min-width:44px;height:44px;display:grid;place-items:center;color:var(--gold-2);font-weight:700;
  border:1.5px solid var(--gold);border-radius:50%;
}
.m-surah{
  text-align:center;margin:16px 0 10px;padding:8px;border:1.5px solid var(--gold);border-radius:8px;
  background:linear-gradient(90deg,transparent,rgba(212,175,55,.2),transparent);
  font-family:'Amiri Quran',serif;font-size:1.7rem;color:var(--gold-2);
}
.m-bism{text-align:center;font-family:'Amiri Quran',serif;font-size:calc(var(--fs)*.85);color:var(--gold-2);margin:6px 0 8px}
.m-run{font-family:'Amiri Quran',serif;font-size:calc(var(--fs)*.9);line-height:2.35;text-align:justify;text-align-last:center;color:var(--text)}
.m-nav{display:flex;justify-content:space-between;gap:12px;max-width:780px;margin:22px auto 0}

.player{
  position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;align-items:center;gap:16px;
  padding:10px clamp(14px,4vw,40px);background:rgba(12,12,12,.97);
  backdrop-filter:blur(12px);border-top:1px solid var(--gold-3);
}
.p-info{display:flex;flex-direction:column;min-width:130px;line-height:1.4}
.p-info strong{color:var(--gold-2);font-family:'Amiri Quran',serif;font-size:1.2rem}
.p-ctrl{display:flex;align-items:center;gap:8px}
#pSeek{flex:1}

.foot{text-align:center;padding:34px 16px;border-top:1px solid var(--line);margin-top:30px}
.foot p{font-family:'Amiri Quran',serif;font-size:1.4rem;color:var(--gold)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:80;background:var(--gold);color:#0a0a0a;padding:10px 22px;border-radius:999px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.loader{color:var(--muted);text-align:center;padding:30px}

::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--gold-3);border-radius:10px}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .brand-name{display:none}
  .p-info{min-width:0}
  .p-info span{display:none}
}
@media (max-width:520px){
  .controls{gap:10px}
  .player{gap:8px}
  .surah-nav .btn,.m-nav .btn{padding:10px 14px;font-size:.85rem}
}
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="#" id="brand">
    <span class="brand-name">نور القرآن</span>
  </a>
  <div class="search">
    <input id="q" type="search" placeholder="ابحث عن سورة أو حديث أو ذكر، أو اضغط Enter للبحث في الآيات" autocomplete="off">
  </div>
  <button id="goMushaf" class="icon-btn" title="المصحف">📖</button>
  <button id="goBookmarks" class="icon-btn" title="المحفوظات">★</button>
</header>

<div class="ayah-banner">﴿ إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ ﴾</div>

<main>
  <section id="home" class="view">
    <div class="hero">
      <div class="hero-main">
        <p class="eyebrow">آية اليوم</p>
        <div id="daily" class="daily"><div class="loader">جارٍ التحميل…</div></div>
        <div class="hero-actions">
          <button id="mushafBtn" class="btn gold">📖 المصحف</button>
          <button id="continueBtn" class="btn ghost" hidden>أكمل من حيث توقفت</button>
          <button id="randomBtn" class="btn ghost">سورة عشوائية</button>
        </div>
      </div>
      <aside class="prayer">
        <div class="prayer-head">
          <h3>مواقيت الصلاة</h3>
          <button id="geoBtn" class="link-btn">موقعي</button>
        </div>
        <p id="prayerPlace" class="muted">القاهرة</p>
        <ul id="prayerList"></ul>
      </aside>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="surahs">السور</button>
      <button class="tab" data-tab="juz">الأجزاء</button>
      <button class="tab" data-tab="hadith">الأحاديث</button>
      <button class="tab" data-tab="morning">أذكار الصباح</button>
      <button class="tab" data-tab="evening">أذكار المساء</button>
      <button class="tab" data-tab="bookmarks">المحفوظات</button>
    </div>
    <div id="list" class="grid"></div>
  </section>

  <section id="results" class="view" hidden>
    <button class="btn ghost back" data-back>→ رجوع</button>
    <h2 id="resultsTitle" class="section-title"></h2>
    <div id="resultsList" class="results"></div>
  </section>

  <section id="reader" class="view" hidden>
    <div class="reader-bar">
      <button class="btn ghost back" data-back>→ السور</button>
      <div class="controls">
        <button id="toMushaf" class="btn ghost">📖 عرض المصحف</button>
        <label class="ctl">القارئ
          <select id="reciter">
            <option value="ar.alafasy">مشاري العفاسي</option>
            <option value="ar.abdulsamad">عبد الباسط عبد الصمد</option>
            <option value="ar.husary">محمود الحصري</option>
            <option value="ar.husarymujawwad">الحصري (المجوّد)</option>
            <option value="ar.mahermuaiqly">ماهر المعيقلي</option>
            <option value="ar.abdurrahmaansudais">عبد الرحمن السديس</option>
            <option value="ar.saoodshuraym">سعود الشريم</option>
            <option value="ar.hudhaify">علي الحذيفي</option>
            <option value="ar.muhammadayyoub">محمد أيوب</option>
            <option value="ar.muhammadjibreel">محمد جبريل</option>
            <option value="ar.shaatree">أبو بكر الشاطري</option>
            <option value="ar.hanirifai">هاني الرفاعي</option>
            <option value="ar.ahmedajamy">أحمد العجمي</option>
            <option value="ar.aymanswoaid">أيمن سويد</option>
            <option value="ar.ibrahimakhbar">إبراهيم الأخضر</option>
            <option value="ar.abdullahbasfar">عبد الله بصفر</option>
          </select>
        </label>
        <label class="ctl">حجم الخط
          <input id="fontSize" type="range" min="22" max="64" value="34">
        </label>
        <label class="switch ctl">
          <input id="tafsirToggle" type="checkbox"><span>التفسير الميسر</span>
        </label>
      </div>
    </div>

    <div class="surah-head">
      <p id="sMeta" class="muted"></p>
      <h1 id="sTitle"></h1>
      <p id="bismillah" class="bismillah">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</p>
      <button id="playSurah" class="btn gold">▶ استمع للسورة كاملة</button>
    </div>

    <div id="ayahs"></div>

    <div class="surah-nav">
      <button id="prevSurah" class="btn ghost">السورة السابقة →</button>
      <button id="nextSurah" class="btn ghost">← السورة التالية</button>
    </div>
  </section>

  <section id="mushaf" class="view" hidden>
    <div class="m-bar">
      <button class="btn ghost back" data-back>→ الرئيسية</button>
      <div class="m-ctrls">
        <select id="mSurah"><option value="">اذهب إلى سورة…</option></select>
        <label class="ctl">صفحة
          <input id="mPageInput" class="m-input" type="number" min="1" max="604" value="1">
        </label>
        <button id="mSmall" class="icon-btn" title="تصغير الخط">أ-</button>
        <button id="mBig" class="icon-btn" title="تكبير الخط">أ+</button>
      </div>
    </div>

    <div id="mPage" class="m-page"></div>

    <div class="m-nav">
      <button id="mPrev" class="btn ghost">الصفحة السابقة →</button>
      <button id="mNext" class="btn gold">← الصفحة التالية</button>
    </div>
  </section>
</main>


<div id="player" class="player" hidden>
  <div class="p-info">
    <strong id="pTitle">—</strong>
    <span id="pSub" class="muted"></span>
  </div>
  <div class="p-ctrl">
    <button id="pPrev" class="icon-btn" title="السابقة">⏮</button>
    <button id="pPlay" class="icon-btn big" title="تشغيل / إيقاف">▶</button>
    <button id="pNext" class="icon-btn" title="التالية">⏭</button>
  </div>
  <input id="pSeek" type="range" min="0" max="100" value="0" step="0.1">
  <button id="pClose" class="icon-btn" title="إغلاق">✕</button>
</div>

<div id="toast" class="toast" hidden></div>

<script>
const API = 'https://api.alquran.cloud/v1';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

const state = {
  surahs: [], cur: null, data: null,
  reciter: store.get('reciter', 'ar.alafasy'),
  tafsir: store.get('tafsir', false),
  fs: store.get('fs', 34),
  playing: -1, tab: 'surahs', cache: {}
};

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if (j.code && j.code !== 200) throw new Error(j.status || 'API error');
  return j.data;
}

function goHome() {
  stopAudio();
  history.replaceState(null, '', location.pathname);
  showView('home');
  renderList();
  updateContinue();
}

async function loadSurahs() {
  try {
    state.surahs = await getJSON(`${API}/surah`);
  } catch {
    $('#list').innerHTML = '<p class="empty">تعذّر تحميل قائمة السور. تأكد من اتصال الإنترنت ثم أعد المحاولة.</p>';
    return;
  }
  renderList();
}

function renderList(filter = '') {
  const box = $('#list');
  const f = norm(filter);
  let html = '';
  box.classList.toggle('hadith-list', ['hadith', 'morning', 'evening'].includes(state.tab));

  if (state.tab === 'morning' || state.tab === 'evening') {
    const k = state.tab === 'morning' ? 'm' : 'e';
    const st = azState();
    const items = ADHKAR.map((x, i) => ({ ...x, i })).filter(x => (!x.only || x.only === k) && (!f || norm(x[k] || x.t).includes(f)));
    html = items.length ? '<div class="az-top"><span class="muted">اضغط على العدّاد تحت كل ذكر لتسجيل التكرار</span><button class="link-btn" data-az-reset>إعادة العدّ</button></div>' + items.map(x => {
      const done = st[k][x.i] || 0, left = x.n - done;
      return `
      <article class="hadith dhikr ${left <= 0 ? 'done' : ''}">
        <p class="h-intro">${esc(x.h)} · ${azTimes(x.n)}</p>
        <p class="h-text">${esc(x[k] || x.t)}</p>
        <div class="h-foot"><span class="h-no">${esc(x.src || '')}</span><button class="act ${left <= 0 ? 'on' : ''}" data-az="${x.i}">${left <= 0 ? '✓ تم' : toAr(done) + ' / ' + toAr(x.n)}</button></div>
      </article>`;
    }).join('') : '<p class="empty">لا يوجد ذكر بهذا النص.</p>';
  }

  if (state.tab === 'hadith') {
    const hs = HADITHS.map((h, i) => ({ ...h, n: i + 1 })).filter(h => !f || norm(h.t).includes(f));
    html = hs.length ? hs.map(h => `
      <article class="hadith">
        <p class="h-intro">${esc(h.i)}</p>
        <p class="h-text">${esc(h.t)}</p>
        <div class="h-foot"><span class="h-no">حديث ${toAr(h.n)}</span><button class="act" data-copy-h="${h.n - 1}">نسخ</button></div>
      </article>`).join('') : '<p class="empty">لا يوجد حديث بهذا النص.</p>';
  }

  if (state.tab === 'surahs') {
    const items = state.surahs.filter(s => !f || norm(s.name).includes(f) || s.englishName.toLowerCase().includes(f.toLowerCase()) || String(s.number) === f);
    html = items.map(s => `
      <button class="card" data-s="${s.number}">
        <span class="num"><span>${toAr(s.number)}</span></span>
        <span class="card-body">
          <span class="card-name">${esc(s.name.replace('سُورَةُ ', '').replace('سورة ', ''))}</span><br>
          <span class="card-meta">${s.revelationType === 'Meccan' ? 'مكية' : 'مدنية'} · ${toAr(s.numberOfAyahs)} آية</span>
        </span>
        <span class="card-end">${esc(s.englishName)}</span>
      </button>`).join('');
    if (!items.length) html = '<p class="empty">لا توجد سورة بهذا الاسم. اضغط Enter للبحث في الآيات.</p>';
  }

  if (state.tab === 'juz') {
    html = JUZ.map(([s, a], i) => {
      const sr = state.surahs[s - 1];
      return `
      <button class="card" data-s="${s}" data-a="${a}">
        <span class="num"><span>${toAr(i + 1)}</span></span>
        <span class="card-body">
          <span class="card-name">الجزء ${toAr(i + 1)}</span><br>
          <span class="card-meta">يبدأ من ${sr ? esc(sr.name.replace('سورة ', '')) : ''} · آية ${toAr(a)}</span>
        </span>
      </button>`;
    }).join('');
  }

  if (state.tab === 'bookmarks') {
    const bms = store.get('bm', []);
    html = bms.length ? bms.map(b => `
      <button class="card" data-s="${b.s}" data-a="${b.a}">
        <span class="num"><span>${toAr(b.a)}</span></span>
        <span class="card-body">
          <span class="card-name">${esc(b.name)}</span><br>
          <span class="card-meta">${esc(b.text.split(' ').slice(0, 7).join(' '))}…</span>
        </span>
      </button>`).join('') : '<p class="empty">لا توجد آيات محفوظة بعد. اضغط «☆ حفظ» تحت أي آية.</p>';
  }

  box.innerHTML = html;
}

async function openSurah(n, a = 1, autoplay = false) {
  stopAudio(false);
  showView('reader');
  history.replaceState(null, '', `#s${n}${a > 1 ? ':' + a : ''}`);
  $('#ayahs').innerHTML = '<div class="loader">جارٍ تحميل السورة…</div>';
  $('#sTitle').textContent = '';
  $('#sMeta').textContent = '';

  try {
    const key = `${n}|${state.reciter}`;
    let d = state.cache[key];
    if (!d) {
      d = await getJSON(`${API}/surah/${n}/editions/quran-uthmani,ar.muyassar,${state.reciter}`);
      state.cache[key] = d;
    }
    state.cur = n;
    state.data = d;
    renderSurah(a);
    store.set('last', { s: n, a });
    if (autoplay) play(a - 1);
  } catch {
    $('#ayahs').innerHTML = '<p class="empty">تعذّر تحميل السورة. تحقق من الاتصال وأعد المحاولة.</p>';
  }
}

function ayahText(n, ay) {
  let t = ay.text;
  if (n !== 1 && n !== 9 && ay.numberInSurah === 1) t = t.split(' ').slice(4).join(' ');
  return t;
}

function renderSurah(focusAyah = 1) {
  const [ar, tf] = state.data;
  const n = ar.number;
  const bms = store.get('bm', []);
  const last = store.get('last', null);

  $('#sTitle').textContent = ar.name.replace('سُورَةُ ', 'سورة ');
  $('#sMeta').textContent = `${ar.revelationType === 'Meccan' ? 'مكية' : 'مدنية'} · ${toAr(ar.numberOfAyahs)} آية · ${ar.englishName}`;
  $('#bismillah').hidden = (n === 1 || n === 9);
  document.title = `${ar.name.replace('سُورَةُ ', 'سورة ')} | نور القرآن`;

  $('#ayahs').innerHTML = ar.ayahs.map((ay, i) => {
    const saved = bms.some(b => b.s === n && b.a === ay.numberInSurah);
    const isLast = last && last.s === n && last.a === ay.numberInSurah;
    return `
    <article class="ayah ${isLast ? 'last' : ''}" id="a${ay.numberInSurah}" data-i="${i}">
      <div class="atext" data-act="mark">${esc(ayahText(n, ay))}<span class="amark">﴿${toAr(ay.numberInSurah)}﴾</span></div>
      ${state.tafsir ? `<div class="tafsir">${esc(tf.ayahs[i].text)}</div>` : ''}
      <div class="acts">
        <button class="act" data-act="play">▶ استماع</button>
        <button class="act ${saved ? 'on' : ''}" data-act="bm">${saved ? '★ محفوظة' : '☆ حفظ'}</button>
        <button class="act" data-act="copy">نسخ</button>
      </div>
    </article>`;
  }).join('');

  $('#prevSurah').style.visibility = n <= 1 ? 'hidden' : 'visible';
  $('#nextSurah').style.visibility = n >= 114 ? 'hidden' : 'visible';

  if (focusAyah > 1) {
    setTimeout(() => {
      const el = $('#a' + focusAyah);
      if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }, 120);
  }
}

$('#ayahs').addEventListener('click', e => {
  const target = e.target.closest('[data-act]');
  if (!target) return;
  const ayEl = target.closest('.ayah');
  const i = +ayEl.dataset.i;
  const ay = state.data[0].ayahs[i];
  const n = state.cur;

  switch (target.dataset.act) {
    case 'play': play(i); break;
    case 'mark':
      store.set('last', { s: n, a: ay.numberInSurah });
      $$('.ayah.last').forEach(el => el.classList.remove('last'));
      ayEl.classList.add('last');
      toast('تم حفظ موضع القراءة');
      break;
    case 'bm': {
      let bms = store.get('bm', []);
      const idx = bms.findIndex(b => b.s === n && b.a === ay.numberInSurah);
      if (idx > -1) {
        bms.splice(idx, 1);
        target.classList.remove('on'); target.textContent = '☆ حفظ';
        toast('أُزيلت من المحفوظات');
      } else {
        bms.unshift({ s: n, a: ay.numberInSurah, name: state.data[0].name.replace('سُورَةُ ', 'سورة '), text: ayahText(n, ay) });
        target.classList.add('on'); target.textContent = '★ محفوظة';
        toast('تم الحفظ');
      }
      store.set('bm', bms);
      break;
    }
    case 'copy': {
      const txt = `${ayahText(n, ay)} ﴿${toAr(ay.numberInSurah)}﴾ — ${state.data[0].name.replace('سُورَةُ ', 'سورة ')}`;
      navigator.clipboard.writeText(txt).then(() => toast('تم النسخ')).catch(() => toast('تعذّر النسخ'));
      break;
    }
  }
});

function play(i) {
  const ayahs = state.data[2].ayahs;
  if (i < 0 || i >= ayahs.length) return;
  state.playing = i;
  audio.src = ayahs[i].audio;
  audio.play().catch(() => toast('تعذّر تشغيل الصوت'));

  $$('.ayah.active').forEach(el => el.classList.remove('active'));
  const el = $('#a' + ayahs[i].numberInSurah);
  if (el) { el.classList.add('active'); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }

  $('#player').hidden = false;
  $('#pTitle').textContent = state.data[0].name.replace('سُورَةُ ', 'سورة ');
  $('#pSub').textContent = `آية ${toAr(ayahs[i].numberInSurah)} · ${$('#reciter').selectedOptions[0].textContent}`;
  store.set('last', { s: state.cur, a: ayahs[i].numberInSurah });
}

function stopAudio(hidePlayer = true) {
  audio.pause();
  audio.removeAttribute('src');
  state.playing = -1;
  $$('.ayah.active').forEach(el => el.classList.remove('active'));
  $('#pPlay').textContent = '▶';
  $('#pSeek').value = 0;
  if (hidePlayer) $('#player').hidden = true;
}

audio.addEventListener('play', () => ($('#pPlay').textContent = '❚❚'));
audio.addEventListener('pause', () => ($('#pPlay').textContent = '▶'));
audio.addEventListener('timeupdate', () => {
  if (audio.duration) $('#pSeek').value = (audio.currentTime / audio.duration) * 100;
});
audio.addEventListener('ended', () => {
  const total = state.data[2].ayahs.length;
  if (state.playing + 1 < total) play(state.playing + 1);
  else if (state.cur < 114) openSurah(state.cur + 1, 1, true);
  else stopAudio();
});

$('#pPlay').onclick = () => {
  if (!audio.src) return state.data && play(0);
  audio.paused ? audio.play() : audio.pause();
};
$('#pNext').onclick = () => play(state.playing + 1);
$('#pPrev').onclick = () => play(Math.max(0, state.playing - 1));
$('#pClose').onclick = () => stopAudio();
$('#pSeek').oninput = e => { if (audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration; };
$('#playSurah').onclick = () => play(0);

$('#reciter').value = state.reciter;
if ($('#reciter').value !== state.reciter) { state.reciter = 'ar.alafasy'; $('#reciter').value = state.reciter; store.set('reciter', state.reciter); }
$('#reciter').onchange = async e => {
  state.reciter = e.target.value;
  store.set('reciter', state.reciter);
  const wasPlaying = state.playing;
  const cur = state.cur;
  const ayNum = wasPlaying >= 0 ? state.data[0].ayahs[wasPlaying].numberInSurah : 1;
  await openSurah(cur, ayNum, wasPlaying >= 0);
};

document.documentElement.style.setProperty('--fs', state.fs + 'px');
$('#fontSize').value = state.fs;
$('#fontSize').oninput = e => {
  state.fs = +e.target.value;
  document.documentElement.style.setProperty('--fs', state.fs + 'px');
  store.set('fs', state.fs);
};

$('#tafsirToggle').checked = state.tafsir;
$('#tafsirToggle').onchange = e => {
  state.tafsir = e.target.checked;
  store.set('tafsir', state.tafsir);
  if (state.data) {
    const keep = state.playing >= 0 ? state.data[0].ayahs[state.playing].numberInSurah : 0;
    renderSurah();
    if (keep) { const el = $('#a' + keep); if (el) el.classList.add('active'); }
  }
};

$('#prevSurah').onclick = () => openSurah(state.cur - 1);
$('#nextSurah').onclick = () => openSurah(state.cur + 1);
$$('[data-back]').forEach(b => (b.onclick = goHome));
$('#brand').onclick = e => { e.preventDefault(); $('#q').value = ''; state.tab = 'surahs'; setTab('surahs'); goHome(); };

function setTab(t) {
  state.tab = t;
  $$('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  renderList($('#q').value);
}
$$('.tab').forEach(b => (b.onclick = () => setTab(b.dataset.tab)));
$('#goBookmarks').onclick = () => { goHome(); setTab('bookmarks'); $('#list').scrollIntoView({ behavior: 'smooth' }); };

$('#list').addEventListener('click', e => {
  const cb = e.target.closest('[data-copy-h]');
  if (cb) {
    const h = HADITHS[+cb.dataset.copyH];
    navigator.clipboard.writeText(`${h.i}: «${h.t}»`).then(() => toast('تم النسخ')).catch(() => toast('تعذّر النسخ'));
    return;
  }
  const k = state.tab === 'morning' ? 'm' : 'e';
  const az = e.target.closest('[data-az]');
  if (az) {
    const i = +az.dataset.az, st = azState();
    st[k][i] = Math.min(ADHKAR[i].n, (st[k][i] || 0) + 1);
    store.set('az', st);
    renderList($('#q').value);
    return;
  }
  if (e.target.closest('[data-az-reset]')) {
    const st = azState();
    st[k] = {};
    store.set('az', st);
    renderList($('#q').value);
    toast('تمت إعادة العدّ');
    return;
  }
  const c = e.target.closest('.card');
  if (c) openSurah(+c.dataset.s, +(c.dataset.a || 1));
});

$('#q').addEventListener('input', e => {
  if (!['surahs', 'hadith', 'morning', 'evening'].includes(state.tab)) setTab('surahs');
  if (!$('#home').hidden) renderList(e.target.value);
});

$('#q').addEventListener('keydown', async e => {
  if (e.key !== 'Enter') return;
  const q = e.target.value.trim();
  if (q.length < 2) return toast('اكتب كلمتين على الأقل');
  showView('results');
  $('#resultsTitle').textContent = `نتائج البحث عن «${q}»`;
  $('#resultsList').innerHTML = '<div class="loader">جارٍ البحث…</div>';
  try {
    const d = await getJSON(`${API}/search/${encodeURIComponent(q)}/all/quran-simple`);
    const total = d.count;
    const rx = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'g');
    $('#resultsTitle').textContent = `«${q}» — ${toAr(total)} نتيجة${total > 60 ? ' (أول ٦٠)' : ''}`;
    $('#resultsList').innerHTML = d.matches.slice(0, 60).map(m => `
      <button class="result" data-s="${m.surah.number}" data-a="${m.numberInSurah}">
        <div class="rt">${esc(m.text).replace(rx, '<mark>$1</mark>')}</div>
        <div class="rr">${esc(m.surah.name)} · آية ${toAr(m.numberInSurah)}</div>
      </button>`).join('');
  } catch {
    $('#resultsList').innerHTML = '<p class="empty">لم نعثر على نتائج. جرّب كلمة أخرى (بدون تشكيل).</p>';
    $('#resultsTitle').textContent = `لا نتائج لـ «${q}»`;
  }
});
$('#resultsList').addEventListener('click', e => {
  const r = e.target.closest('.result');
  if (r) openSurah(+r.dataset.s, +r.dataset.a);
});

async function loadDaily() {
  const now = new Date();
  const doy = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 864e5);
  const num = ((doy * 37 + now.getFullYear()) % 6236) + 1;
  try {
    const d = await getJSON(`${API}/ayah/${num}/editions/quran-uthmani,ar.muyassar`);
    const [a, t] = d;
    const txt = a.numberInSurah === 1 && a.surah.number !== 1 && a.surah.number !== 9 ? a.text.split(' ').slice(4).join(' ') : a.text;
    $('#daily').innerHTML = `
      <p class="verse">${esc(txt)} ﴿${toAr(a.numberInSurah)}﴾</p>
      <p class="ref">${esc(a.surah.name)} · آية ${toAr(a.numberInSurah)}</p>
      <p class="tf">${esc(t.text)}</p>`;
    $('#daily').style.cursor = 'pointer';
    $('#daily').onclick = () => openSurah(a.surah.number, a.numberInSurah);
  } catch {
    $('#daily').innerHTML = '<p class="verse">﴿ أَلَا بِذِكْرِ ٱللَّهِ تَطْمَئِنُّ ٱلْقُلُوبُ ﴾</p><p class="ref">سورة الرعد · آية ٢٨</p>';
  }
}

function updateContinue() {
  const last = store.get('last', null);
  const btn = $('#continueBtn');
  if (last && state.surahs.length) {
    const s = state.surahs[last.s - 1];
    btn.hidden = false;
    btn.textContent = `أكمل: ${s.name} · آية ${toAr(last.a)}`;
    btn.onclick = () => openSurah(last.s, last.a);
  }
}
$('#randomBtn').onclick = () => openSurah(Math.floor(Math.random() * 114) + 1);

const PRAYERS = [['Fajr', 'الفجر'], ['Sunrise', 'الشروق'], ['Dhuhr', 'الظهر'], ['Asr', 'العصر'], ['Maghrib', 'المغرب'], ['Isha', 'العشاء']];

function fmt12(t) {
  let [h, m] = t.slice(0, 5).split(':').map(Number);
  const suf = h >= 12 ? 'م' : 'ص';
  h = h % 12 || 12;
  return `${toAr(h)}:${toAr(String(m).padStart(2, '0'))} ${suf}`;
}

async function loadPrayer(coords) {
  try {
    const url = coords
      ? `https://api.aladhan.com/v1/timings?latitude=${coords.latitude}&longitude=${coords.longitude}&method=5`
      : 'https://api.aladhan.com/v1/timingsByCity?city=Cairo&country=Egypt&method=5';
    const r = await fetch(url);
    const t = (await r.json()).data.timings;
    const nowM = new Date().getHours() * 60 + new Date().getMinutes();
    const mins = PRAYERS.map(([k]) => { const [h, m] = t[k].split(':').map(Number); return h * 60 + m; });
    let next = mins.findIndex(m => m > nowM);
    if (next === -1) next = 0;
    $('#prayerList').innerHTML = PRAYERS.map(([k, ar], i) =>
      `<li class="${i === next ? 'next' : ''}"><span>${ar}</span><span>${fmt12(t[k])}</span></li>`).join('');
    $('#prayerPlace').textContent = coords ? 'حسب موقعك الحالي' : 'القاهرة، مصر';
  } catch {
    $('#prayerList').innerHTML = '<li class="muted">تعذّر تحميل المواقيت</li>';
  }
}
$('#geoBtn').onclick = () => {
  if (!navigator.geolocation) return toast('المتصفح لا يدعم تحديد الموقع');
  navigator.geolocation.getCurrentPosition(
    p => loadPrayer(p.coords),
    () => toast('لم يتم السماح بتحديد الموقع')
  );
};

/* ================= المصحف ================= */
const _showView = showView;
showView = function (name) {
  _showView(name);
  $('#mushaf').hidden = name !== 'mushaf';
};

const mState = { page: store.get('mp', 1), cache: {} };

function fillMushafSurahs() {
  const sel = $('#mSurah');
  if (sel.options.length > 1 || !state.surahs.length) return;
  state.surahs.forEach(s => {
    const o = document.createElement('option');
    o.value = s.number;
    o.textContent = `${toAr(s.number)}. ${s.name.replace('سُورَةُ ', '').replace('سورة ', '')}`;
    sel.appendChild(o);
  });
}

async function openMushaf(p = mState.page) {
  p = Math.min(604, Math.max(1, parseInt(p) || 1));
  stopAudio();
  showView('mushaf');
  mState.page = p;
  store.set('mp', p);
  history.replaceState(null, '', `#m${p}`);
  fillMushafSurahs();
  $('#mPageInput').value = p;
  $('#mPrev').style.visibility = p <= 1 ? 'hidden' : 'visible';
  $('#mNext').style.visibility = p >= 604 ? 'hidden' : 'visible';
  $('#mPage').innerHTML = '<div class="loader">جارٍ تحميل الصفحة…</div>';
  try {
    let d = mState.cache[p];
    if (!d) { d = await getJSON(`${API}/page/${p}/quran-uthmani`); mState.cache[p] = d; }
    if (mState.page !== p) return;
    renderMushaf(d, p);
    window.scrollTo({ top: 0 });
  } catch {
    $('#mPage').innerHTML = '<p class="empty">تعذّر تحميل الصفحة. تحقق من الاتصال وأعد المحاولة.</p>';
  }
  if (p < 604 && !mState.cache[p + 1]) {
    getJSON(`${API}/page/${p + 1}/quran-uthmani`).then(x => (mState.cache[p + 1] = x)).catch(() => {});
  }
}

function renderMushaf(d, p) {
  const ays = d.ayahs;
  const first = ays[0];
  let body = '', run = '';
  const flush = () => { if (run) { body += `<p class="m-run">${run}</p>`; run = ''; } };

  ays.forEach(ay => {
    const n = ay.surah.number;
    let txt = ay.text;
    if (ay.numberInSurah === 1) {
      flush();
      body += `<div class="m-surah">${esc(ay.surah.name)}</div>`;
      if (n !== 1 && n !== 9) {
        body += '<div class="m-bism">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>';
        txt = txt.split(' ').slice(4).join(' ');
      }
    }
    run += `${esc(txt)} <span class="amark">﴿${toAr(ay.numberInSurah)}﴾</span> `;
  });
  flush();

  $('#mPage').innerHTML = `
    <div class="m-top"><span>${esc(first.surah.name)}</span><span>الجزء ${toAr(first.juz)}</span></div>
    <div class="m-body">${body}</div>
    <div class="m-foot"><span>${toAr(p)}</span></div>`;
  document.title = `${first.surah.name} · صفحة ${toAr(p)} | نور القرآن`;
}

$('#goMushaf').onclick = () => openMushaf();
$('#mushafBtn').onclick = () => openMushaf();
$('#toMushaf').onclick = () => {
  const pg = state.data && state.data[0].ayahs[0].page;
  openMushaf(pg || 1);
};
$('#mNext').onclick = () => openMushaf(mState.page + 1);
$('#mPrev').onclick = () => openMushaf(mState.page - 1);
$('#mPageInput').onchange = e => openMushaf(e.target.value);
$('#mSurah').onchange = async e => {
  const s = e.target.value;
  if (!s) return;
  try {
    const a = await getJSON(`${API}/ayah/${s}:1`);
    openMushaf(a.page);
  } catch { toast('تعذّر الانتقال للسورة'); }
  e.target.value = '';
};

function mFont(delta) {
  state.fs = Math.min(64, Math.max(22, state.fs + delta));
  document.documentElement.style.setProperty('--fs', state.fs + 'px');
  $('#fontSize').value = state.fs;
  store.set('fs', state.fs);
}
$('#mBig').onclick = () => mFont(2);
$('#mSmall').onclick = () => mFont(-2);

document.addEventListener('keydown', e => {
  if ($('#mushaf').hidden) return;
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.key === 'ArrowLeft') openMushaf(mState.page + 1);
  if (e.key === 'ArrowRight') openMushaf(mState.page - 1);
});

let tx = 0;
$('#mPage').addEventListener('touchstart', e => (tx = e.touches[0].clientX), { passive: true });
$('#mPage').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (dx < -70) openMushaf(mState.page + 1);
  else if (dx > 70) openMushaf(mState.page - 1);
});

(async function init() {
  loadDaily();
  loadPrayer();
  await loadSurahs();
  updateContinue();
  const m = location.hash.match(/^#s(\d+)(?::(\d+))?$/);
  if (m && +m[1] >= 1 && +m[1] <= 114) openSurah(+m[1], +(m[2] || 1));
  const mm = location.hash.match(/^#m(\d+)$/);
  if (mm) openMushaf(+mm[1]);
})();

document.addEventListener('keydown', e => {
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.code === 'Space' && !$('#player').hidden) { e.preventDefault(); $('#pPlay').click(); }
  if (e.key === 'ArrowLeft' && !$('#player').hidden) $('#pNext').click();
  if (e.key === 'ArrowRight' && !$('#player').hidden) $('#pPrev').click();
});

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('nexttrack', () => $('#pNext').click());
  navigator.mediaSession.setActionHandler('previoustrack', () => $('#pPrev').click());
}
